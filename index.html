<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Тілашар — казахский язык шаг за шагом</title>
    <meta name="description" content="Тілашар — тренажёр казахского языка для тех, кто говорит по-русски. Диалоги, правила и семь типов упражнений. Работает офлайн." />

    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <!-- iPhone берёт иконку отсюда и ждёт ровно 180×180: свой размер чётче,
         чем ужатый системой 192-й. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />

    <!-- Цвет системной панели под каждую тему отдельно. -->
    <meta name="theme-color" content="#F8FAFD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11161E" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Тілашар" />

    <!--
      Шрифт лежит в самом приложении, а не на Google Fonts: приложение должно
      работать офлайн и внутри APK. Кириллический сабсет грузим заранее — весь
      интерфейс на нём.
    -->
    <link rel="preload" href="/fonts/golos-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/golos-cyrillic-ext.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Для работы тренажёра нужен включённый JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
