# Сборка Android-приложения в облаке.
#
# Локально Android SDK не нужен: раннер GitHub уже содержит JDK и SDK.
# После пуша в main через несколько минут готовый .apk лежит в артефактах
# сборки, а для тега вида v1.0 — ещё и в разделе Releases, откуда его
# можно скачать по прямой ссылке или QR-коду.

name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:        # кнопка «запустить вручную» во вкладке Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Проект собирается под Android SDK 36. На раннере набор платформ
      # меняется со временем, поэтому нужную версию ставим явно —
      # иначе сборка падает с «SDK not found» на ровном месте.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Установить зависимости
        run: npm ci

      - name: Проверить типы
        run: npx tsc --noEmit

      - name: Прогнать тесты
        run: npm test

      - name: Собрать веб-часть
        run: npm run build

      - name: Перенести веб-сборку в проект Android
        # Именно `copy`, а не `sync`. Sync дополнительно запускает обновление
        # нативной части, и при установленном на раннере Android SDK Capacitor
        # затевает там свою синхронизацию Gradle — на этом шаге падали все
        # предыдущие сборки, хотя локально та же команда проходит.
        # Нативный проект со всеми подключёнными плагинами лежит в репозитории,
        # поэтому достаточно скопировать свежую веб-часть, а всю сборку
        # выполнит Gradle следующим шагом.
        run: npx cap copy android

      - name: Собрать APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Переименовать APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GrammarQuest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GrammarQuest-APK
          path: GrammarQuest.apk
          retention-days: 90

      - name: Опубликовать в Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GrammarQuest.apk
          body: |
            Установка на Android:
            1. Скачайте GrammarQuest.apk по ссылке ниже.
            2. Откройте файл на телефоне.
            3. Разрешите установку из этого источника, когда система спросит.

            Приложение работает полностью офлайн — интернет нужен только для скачивания.
